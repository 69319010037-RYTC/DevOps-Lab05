<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7fc">
  <title>เกมต่อภาพรถยนต์</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="page-header">
      <p class="eyebrow">JIGSAW PUZZLE</p>
      <h1>ต่อภาพรถยนต์</h1>
      <p class="intro">นำชิ้นส่วนรูปทรงจิ๊กซอว์มาต่อกันให้เป็นภาพรถยนต์ที่สมบูรณ์</p>
    </header>

    <section class="game-panel" aria-label="เกมต่อภาพ">
      <div class="game-toolbar">
        <p class="progress">วางแล้ว <strong id="progress">0 / 20</strong> ชิ้น</p>
        <div class="toolbar-actions">
          <button class="music-button" id="music-toggle" type="button" aria-controls="background-music" aria-pressed="false">เปิดเพลง</button>
          <button class="restart-button" id="restart" type="button">เริ่มใหม่</button>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="group" aria-label="กระดานต่อภาพ"></div>
      </div>

      <div class="piece-area">
        <div class="piece-heading">
          <h2>ชิ้นส่วน</h2>
          <span>ลากชิ้นส่วน หรือเลือกชิ้นส่วนแล้วเลือกช่องบนกระดาน</span>
        </div>
        <div class="piece-tray" id="piece-tray" role="group" aria-label="ชิ้นส่วนที่ยังไม่ได้วาง"></div>
      </div>

      <p class="game-status" id="game-status" aria-live="polite">กำลังเตรียมชิ้นส่วน...</p>
    </section>
  </main>
  <audio id="background-music" loop preload="none">
    <source src="background-music.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
